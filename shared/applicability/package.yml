name: "cpe:/a:{arg}:{ver_specs_cpe}"
title: "Package {pkgname} is installed"
versioned: true
template:
  name: platform_package
args:
  aide:
    pkgname: aide
  apparmor:
    {{% if product in ["sle12", "sle15"] %}}
    pkgname: apparmor-profiles
    {{% else %}}
    pkgname: apparmor  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  apport:
    pkgname: apport
  audit:
    {{% if pkg_system == "rpm" %}}
    pkgname: audit
    {{% else %}}
    pkgname: auditd  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  autofs:
    pkgname: autofs
  avahi:
    {{% if 'ubuntu' in product or product in ['debian12', 'debian13'] %}}
    pkgname: avahi-daemon
    {{% else %}}
    pkgname: avahi  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  bash:
    pkgname: bash
  bind:
    pkgname: bind
  chrony:
    pkgname: chrony
  dnf:
    {{% if product == "fedora" %}}
    pkgname: dnf5
    {{% else %}}
    pkgname: dnf  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  firewalld:
    pkgname: firewalld
  gdm:
    {{% if pkg_system == "rpm" %}}
    pkgname: gdm
    {{% else %}}
    pkgname: gdm3  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  iptables:
    pkgname: iptables
  krb5-libs:
    {{% if 'suse' in families %}}
    pkgname: krb5
    {{% else %}}
    pkgname: krb5-libs  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  libpwquality:
    {{% if 'debian' in product or 'suse' in families or 'ubuntu' in product %}}
    pkgname: libpwquality1
    {{% else %}}
    pkgname: libpwquality  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  libreswan:
    {{% if product in  ["opensuse16", "sle15", "sle16"] %}}
    pkgname: strongswan-ipsec
    {{% else %}}
    pkgname: libreswan  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  libuser:
    pkgname: libuser
  logrotate:
    pkgname: logrotate
  net-snmp:
    {{% if pkg_system == "rpm" %}}
    pkgname: net-snmp
    {{% else %}}
    pkgname: snmp  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  networkmanager:
    {{% if product in ["ubuntu2204", "ubuntu2404", "ubuntu2604"] %}}
    pkgname: network-manager
    {{% else %}}
    pkgname: NetworkManager  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  nftables:
    pkgname: nftables
  nss-pam-ldapd:
    {{% if pkg_system == "rpm" %}}
    pkgname: nss-pam-ldapd
    {{% else %}}
    pkgname: libpam-ldapd  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  ntp:
    {{% if product == "debian13" %}}
    pkgname: ntpsec
    {{% else %}}
    pkgname: ntp  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
    title: NTP daemon and utilities
  openssh:
    pkgname: openssh
  openssh-clients:
    {{% if pkg_system == "dpkg" %}}
    pkgname: openssh-client
    {{% else %}}
    pkgname: openssh-clients  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  openssh-server:
    pkgname: openssh-server
  openssl:
    pkgname: openssl
  pam:
    {{% if pkg_system == "rpm" %}}
    {{% if product in ["openembedded"] %}}
    pkgname: libpam-runtime
    {{% else %}}
    pkgname: pam  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
    {{% else %}}
    pkgname: libpam-runtime  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  pam_apparmor:
    pkgname: pam_apparmor
  polkit:
    pkgname: polkit
  postfix:
    pkgname: postfix
  rsh-server:
    pkgname: rsh-server
  shadow-utils:
    {{% if pkg_system == "rpm" %}}
    {{% if 'suse' in families or product in ["kylinserver10", "kylinsecserver6", "openeuler2203", "uosserver25"] %}}
    pkgname: shadow
    {{% elif product in ["openembedded"] %}}
    pkgname: shadow-base  # yamllint disable-line rule:key-duplicates
    {{% else %}}
    pkgname: shadow-utils  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
    {{% else %}}
    pkgname: login  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  snmpd:
    {{% if 'debian' in product or product == 'ubuntu2604' %}}
    pkgname: snmpd
    {{% else %}}
    pkgname: net-snmp  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  squid:
    pkgname: squid
  sssd:
    {{% if 'sle' in product or 'ubuntu' in product %}}
    pkgname: sssd
    {{% else %}}
    pkgname: sssd-common  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  sudo:
    pkgname: sudo
  systemd:
    pkgname: systemd
  systemd-journal-remote:
    pkgname: systemd-journal-remote
  systemd-timesyncd:
    pkgname: systemd-timesyncd
  telnet-server:
    {{% if product in ['debian13'] %}}
    pkgname: inetutils-telnetd
    {{% else %}}
    pkgname: telnet-server  # yamllint disable-line rule:key-duplicates
    {{% endif %}}
  tftp-server:
    pkgname: tftp-server
  tmux:
    pkgname: tmux
  ufw:
    pkgname: ufw
  usbguard:
    pkgname: usbguard
  yum:
    pkgname: yum
  zypper:
    pkgname: zypper
  apt_get:
    pkgname: apt
  rsyslog:
    pkgname: rsyslog
  rootfiles:
    pkgname: rootfiles
  tcsh:
    pkgname: tcsh
  displaymanager-sysconfig:
    pkgname: displaymanager-sysconfig
