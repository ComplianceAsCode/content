---
# Run complyctl NIST scans on the Fedora VM.
#
# Prerequisites:
#   - setup_fedora.yml has been run
#   - A Gemara bundle has been pushed to the VM's registry
#
# Usage (from utils/nist_sync/):
#   # First, push the bundle from the host:
#   python3 utils/nist_sync/generate_complyctl_bundle.py --product fedora --push \
#       --registry "http://$(vagrant ssh-config | awk '/HostName/ {print $2}'):5500"
#
#   # Then run this playbook:
#   ansible-playbook -i ansible/inventory.ini ansible/scan_fedora.yml

- name: Run complyctl NIST scans on Fedora
  hosts: fedora_scanner
  become: true
  vars:
    registry_port: "{{ lookup('env', 'REGISTRY_PORT') | default('5500', true) }}"
    policy_id: nist-800-53-rev5-fedora
    bundle_ref: "localhost:{{ registry_port }}/nist-800-53-rev5-fedora"
    # Baselines to test (Low / Moderate / High)
    baselines:
      - low
      - moderate
      - high

  tasks:
    - name: Ensure complytime config directory exists
      ansible.builtin.file:
        path: /root/.complytime
        state: directory
        mode: "0700"

    - name: Create complytime.yaml
      ansible.builtin.copy:
        dest: /root/.complytime/complytime.yaml
        mode: "0600"
        content: |
          policies:
            {{ policy_id }}:
              source: http://{{ bundle_ref }}
              variables:
                profile: nist_800_53
                datastream: /usr/share/xml/scap/ssg/content/ssg-fedora-ds.xml

    - name: Show complytime config
      ansible.builtin.command: cat /root/.complytime/complytime.yaml
      register: config_content
      changed_when: false

    - name: Display config
      ansible.builtin.debug:
        msg: "{{ config_content.stdout_lines }}"

    - name: Test registry connectivity
      ansible.builtin.command: >
        curl -sf http://localhost:{{ registry_port }}/v2/_catalog
      register: catalog
      changed_when: false
      failed_when: false

    - name: Show registry catalog
      ansible.builtin.debug:
        msg: "{{ catalog.stdout }}"

    - name: Run complyctl scans for each baseline
      ansible.builtin.shell: |
        set -e
        echo "=== Baseline: {{ item }} ==="
        /usr/local/bin/complyctl scan \
          --policy {{ policy_id }} \
          --assessment-plan {{ item }} \
          --output /tmp/nist-fedora-{{ item }}.json \
          --verbose
        echo "Scan complete: /tmp/nist-fedora-{{ item }}.json"
        echo ""
        echo "Results summary:"
        jq -r '.results[] | "\(.rule_id): \(.result)"' /tmp/nist-fedora-{{ item }}.json | head -20
        echo ""
        echo "Pass/Fail counts:"
        jq -r '.results | group_by(.result) | map({result: .[0].result, count: length}) | .[]' \
          /tmp/nist-fedora-{{ item }}.json
      loop: "{{ baselines }}"
      register: scan_results
      changed_when: false

    - name: Display scan results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ scan_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Fetch scan results to host
      ansible.builtin.fetch:
        src: "/tmp/nist-fedora-{{ item }}.json"
        dest: "../results/fedora-{{ item }}.json"
        flat: true
      loop: "{{ baselines }}"
