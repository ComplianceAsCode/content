<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIST 800-53 Control Viewer - Gap Analysis</title>
    <!-- SHARED_STYLES_PLACEHOLDER -->
    <style>
        .gap-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .priority-section {
            margin-bottom: 30px;
        }

        .priority-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .priority-title {
            font-size: 18px;
            font-weight: 600;
        }

        .gap-table {
            width: 100%;
            margin-bottom: 20px;
        }

        .gap-item {
            background: #fff;
            border: 1px solid #e1e4e8;
            border-left: 4px solid #d73a49;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gap-item:hover {
            border-left-color: #0366d6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .gap-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .gap-id {
            font-size: 16px;
            font-weight: 600;
            color: #d73a49;
        }

        .gap-title {
            font-size: 14px;
            color: #24292e;
            margin: 5px 0;
        }

        .family-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .family-card {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 15px;
        }

        .family-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .family-name {
            font-weight: 600;
            color: #24292e;
        }

        .gap-count-badge {
            background: #d73a49;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .gap-open {
            font-size: 12px;
            color: #0366d6;
            text-decoration: none;
            white-space: nowrap;
        }

        .gap-open:hover {
            text-decoration: underline;
        }

        .gap-meta {
            font-size: 12px;
            color: #586069;
            margin-top: 8px;
        }

        .gap-meta a.meta-link {
            color: #0366d6;
            text-decoration: none;
        }

        .gap-meta a.meta-link:hover {
            text-decoration: underline;
        }

        .gap-details {
            margin-top: 10px;
            border-top: 1px solid #e1e4e8;
            padding-top: 8px;
        }

        .gap-details > summary {
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #0366d6;
            list-style: none;
        }

        .gap-details > summary::-webkit-details-marker {
            display: none;
        }

        .gap-details > summary::before {
            content: '\25B8  ';
        }

        .gap-details[open] > summary::before {
            content: '\25BE  ';
        }

        .gap-details-body {
            margin-top: 10px;
            font-size: 13px;
            color: #24292e;
        }

        .meta-section {
            margin-bottom: 12px;
        }

        .meta-section h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #586069;
            margin: 0 0 4px 0;
        }

        .meta-section p {
            margin: 0 0 6px 0;
        }

        .stmt-list {
            margin: 4px 0 4px 18px;
            padding: 0;
        }

        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .meta-tag {
            background: #f1f8ff;
            border: 1px solid #c8e1ff;
            border-radius: 10px;
            padding: 1px 8px;
            font-size: 12px;
        }

        .meta-tag a {
            color: #0366d6;
            text-decoration: none;
        }

        .odp {
            color: #b31d28;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- SHARED_HEADER_PLACEHOLDER -->

    <div class="container">
        <div class="page-header">
            <h2>Gap Analysis</h2>
            <p>Controls that need rule implementation</p>
        </div>

        <!-- Gap Summary -->
        <div class="gap-summary">
            <div class="stat-card">
                <div class="stat-value" id="total-gaps" style="color: #d73a49;">0</div>
                <div class="stat-label">Total Gaps</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="high-gaps" style="color: #721c24;">0</div>
                <div class="stat-label">High Baseline</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="moderate-gaps" style="color: #856404;">0</div>
                <div class="stat-label">Moderate Baseline</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="low-gaps" style="color: #0366d6;">0</div>
                <div class="stat-label">Low Baseline</div>
            </div>
        </div>

        <!-- Priority: High Baseline Gaps -->
        <div class="card priority-section" id="high-section">
            <div class="priority-header">
                <div class="priority-title">
                    🔴 High Baseline Gaps
                </div>
                <span class="badge badge-high" id="high-count">0</span>
            </div>
            <div id="high-gaps-list">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Priority: Moderate Baseline Gaps -->
        <div class="card priority-section" id="moderate-section">
            <div class="priority-header">
                <div class="priority-title">
                    🟡 Moderate Baseline Gaps
                </div>
                <span class="badge badge-moderate" id="moderate-count">0</span>
            </div>
            <div id="moderate-gaps-list">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Priority: Low Baseline Gaps -->
        <div class="card priority-section" id="low-section">
            <div class="priority-header">
                <div class="priority-title">
                    🔵 Low Baseline Gaps
                </div>
                <span class="badge badge-low" id="low-count">0</span>
            </div>
            <div id="low-gaps-list">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Gap Breakdown by Family -->
        <div class="card">
            <h3>Gaps by Control Family</h3>
            <div class="family-breakdown" id="family-breakdown">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        /* DATA_PLACEHOLDER */


        function renderGapAnalysis() {
            if (!EMBEDDED_DATA || !EMBEDDED_DATA.products) {
                document.querySelector('.container').innerHTML =
                    '<div class="empty-state"><h3>Error loading data</h3></div>';
                return;
            }

            const product = CURRENT_PRODUCT;
            const controls = EMBEDDED_DATA.products[product]?.controls || [];
            const gaps = controls.filter(c => !c.has_rules);

            allControlsById = {};
            controls.forEach(c => { allControlsById[c.id] = c; });

            // Count gaps by baseline
            const highGaps = gaps.filter(c => (c.levels || []).includes('high'));
            const moderateGaps = gaps.filter(c => (c.levels || []).includes('moderate') && !(c.levels || []).includes('high'));
            const lowGaps = gaps.filter(c => (c.levels || []).includes('low') && !(c.levels || []).includes('moderate') && !(c.levels || []).includes('high'));

            // Update summary stats
            document.getElementById('total-gaps').textContent = gaps.length;
            document.getElementById('high-gaps').textContent = highGaps.length;
            document.getElementById('moderate-gaps').textContent = moderateGaps.length;
            document.getElementById('low-gaps').textContent = lowGaps.length;

            // Render gaps by priority
            renderGapList('high-gaps-list', 'high-count', highGaps);
            renderGapList('moderate-gaps-list', 'moderate-count', moderateGaps);
            renderGapList('low-gaps-list', 'low-count', lowGaps);

            // Hide empty sections
            document.getElementById('high-section').style.display = highGaps.length > 0 ? 'block' : 'none';
            document.getElementById('moderate-section').style.display = moderateGaps.length > 0 ? 'block' : 'none';
            document.getElementById('low-section').style.display = lowGaps.length > 0 ? 'block' : 'none';

            // Render family breakdown
            renderFamilyBreakdown(gaps);
        }

        let allControlsById = {};

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function controlLink(id) {
            return `<a class="meta-link" href="control-detail.html?id=${encodeURIComponent(id)}">${escapeHtml(id.toUpperCase())}</a>`;
        }

        function parentDescription(control) {
            if (!control.parent_id) {
                return '';
            }
            const parent = allControlsById[control.parent_id];
            const label = parent
                ? `${parent.id.toUpperCase()}: ${parent.title}`
                : control.parent_id.toUpperCase();
            return `<a class="meta-link" href="control-detail.html?id=${encodeURIComponent(control.parent_id)}">${escapeHtml(label)}</a>`;
        }

        // Statement prose is already processed HTML (ODP spans, control links)
        // by generate_nist_viewer.py, so it is intentionally not escaped.
        function renderStatementItems(items) {
            if (!items || items.length === 0) {
                return '';
            }
            return '<ul class="stmt-list">' + items.map(item =>
                `<li>${item.prose}${renderStatementItems(item.items)}</li>`
            ).join('') + '</ul>';
        }

        function renderStatement(statement) {
            if (!statement) {
                return '';
            }
            let html = '';
            if (statement.prose) {
                html += `<p>${statement.prose}</p>`;
            }
            html += renderStatementItems(statement.items);
            return html;
        }

        function renderControlMeta(control) {
            const sections = [];

            const statementHtml = renderStatement(control.statement);
            if (statementHtml) {
                sections.push(
                    `<div class="meta-section"><h4>Control Statement</h4>${statementHtml}</div>`
                );
            }

            if ((control.guidance || []).length > 0) {
                sections.push(
                    '<div class="meta-section"><h4>Supplemental Guidance</h4>' +
                    control.guidance.map(p => `<p>${p}</p>`).join('') +
                    '</div>'
                );
            }

            if ((control.related_controls || []).length > 0) {
                sections.push(
                    '<div class="meta-section"><h4>Related Controls</h4><div class="meta-tags">' +
                    control.related_controls.map(id => `<span class="meta-tag">${controlLink(id)}</span>`).join('') +
                    '</div></div>'
                );
            }

            if ((control.parameters || []).length > 0) {
                sections.push(
                    '<div class="meta-section"><h4>Parameters (ODPs)</h4><div class="meta-tags">' +
                    control.parameters.map(p =>
                        `<span class="meta-tag" title="${escapeHtml(p.id)}">${escapeHtml(p.label || p.id)}</span>`
                    ).join('') +
                    '</div></div>'
                );
            }

            if (sections.length === 0) {
                return '';
            }

            return '<details class="gap-details"><summary>Control metadata</summary>' +
                `<div class="gap-details-body">${sections.join('')}</div></details>`;
        }

        function renderGapMeta(control, familyName, extra) {
            const parts = [escapeHtml(familyName)];
            const parent = parentDescription(control);
            if (parent) {
                parts.push(`Parent: ${parent}`);
            }
            const levels = (control.levels || []).map(l => l.toUpperCase()).join(', ');
            parts.push(`Baselines: ${levels || 'none'}`);
            if (extra) {
                parts.push(extra);
            }
            return parts.join(' | ');
        }

        function renderGapItem(control, familyName, extra, compact) {
            const title = compact
                ? `<span class="gap-id" style="font-size: 13px;">${escapeHtml(control.id.toUpperCase())}</span>
                   <span style="font-size: 13px; color: #24292e;">${escapeHtml(control.title)}</span>`
                : `<div class="gap-id">${escapeHtml(control.id.toUpperCase())}</div>
                   <div class="gap-title">${escapeHtml(control.title)}</div>`;
            const padding = compact ? ' style="padding: 8px 12px; margin-bottom: 4px;"' : '';
            return `
                <div class="gap-item"${padding}>
                    <div class="gap-item-header">
                        <div>${title}</div>
                        <a class="gap-open" href="control-detail.html?id=${encodeURIComponent(control.id)}">
                            Open control &rarr;
                        </a>
                    </div>
                    <div class="gap-meta">${renderGapMeta(control, familyName, extra)}</div>
                    ${renderControlMeta(control)}
                </div>
            `;
        }

        function renderGapList(containerId, countId, gaps) {
            const container = document.getElementById(containerId);
            const countBadge = document.getElementById(countId);

            countBadge.textContent = gaps.length;

            if (gaps.length === 0) {
                container.innerHTML = '<p style="color: #586069; text-align: center; padding: 20px;">No gaps in this category</p>';
                return;
            }

            // Group gaps: base controls with their enhancement gaps
            const baseGaps = gaps.filter(c => !c.parent_id);
            const enhGapsByParent = {};
            gaps.forEach(c => {
                if (c.parent_id) {
                    if (!enhGapsByParent[c.parent_id]) enhGapsByParent[c.parent_id] = [];
                    enhGapsByParent[c.parent_id].push(c);
                }
            });

            let html = '';

            baseGaps.forEach(control => {
                const familyName = getFamilyName(control.id.split('-')[0]);
                const childGaps = enhGapsByParent[control.id] || [];
                const extra = childGaps.length > 0
                    ? `${childGaps.length} enhancement gap${childGaps.length > 1 ? 's' : ''}`
                    : '';

                html += renderGapItem(control, familyName, extra, false);

                if (childGaps.length > 0) {
                    html += '<div style="margin-left: 20px; border-left: 2px solid #e1e4e8; padding-left: 12px;">';
                    childGaps.forEach(enh => {
                        html += renderGapItem(
                            enh, getFamilyName(enh.id.split('-')[0]), '', true);
                    });
                    html += '</div>';
                }
            });

            // Orphan enhancement gaps (parent not in this gap list)
            const orphanEnhGaps = gaps.filter(c => c.parent_id && !baseGaps.find(b => b.id === c.parent_id));
            orphanEnhGaps.forEach(control => {
                html += renderGapItem(
                    control, getFamilyName(control.id.split('-')[0]), '', false);
            });

            container.innerHTML = html;
        }

        function renderFamilyBreakdown(gaps) {
            const familyGaps = {};

            // Count gaps by family
            gaps.forEach(control => {
                const familyId = control.id.split('-')[0];
                if (!familyGaps[familyId]) {
                    familyGaps[familyId] = [];
                }
                familyGaps[familyId].push(control);
            });

            // Sort families by gap count (descending)
            const sortedFamilies = Object.entries(familyGaps)
                .sort((a, b) => b[1].length - a[1].length);

            const container = document.getElementById('family-breakdown');

            if (sortedFamilies.length === 0) {
                container.innerHTML = '<p style="color: #586069; text-align: center; padding: 20px;">No gaps found</p>';
                return;
            }

            container.innerHTML = sortedFamilies.map(([familyId, controls]) => {
                const familyName = getFamilyName(familyId);
                const gapCount = controls.length;

                return `
                    <div class="family-card">
                        <div class="family-card-header">
                            <div class="family-name">${familyName}</div>
                            <div class="gap-count-badge">${gapCount}</div>
                        </div>
                        <div style="font-size: 13px; color: #586069;">
                            ${controls.slice(0, 5).map(c => c.id.toUpperCase()).join(', ')}
                            ${controls.length > 5 ? `<br>+ ${controls.length - 5} more` : ''}
                        </div>
                        <a href="family.html?family=${familyId}" class="btn" style="margin-top: 10px; width: 100%;">
                            View Family Details
                        </a>
                    </div>
                `;
            }).join('');
        }

        function getFamilyName(familyId) {
            const family = EMBEDDED_DATA.families.find(f => f.id === familyId);
            return family ? family.name : 'Other';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', renderGapAnalysis);
    </script>
</body>
</html>
