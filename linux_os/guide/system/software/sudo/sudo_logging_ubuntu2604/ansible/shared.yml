# platform = Ubuntu 26.04
# reboot = false
# strategy = restrict
# complexity = low
# disruption = low

- name: Install rsyslog for sudo event logging
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: Enable rsyslog for sudo event logging
  ansible.builtin.systemd_service:
    name: rsyslog.service
    enabled: true
    state: started
