# platform = multi_platform_all
# reboot = false
# strategy = enable
# complexity = low
# disruption = low

- name: "{{{ rule_title }}} - Ensure aide is installed"
  ansible.builtin.package:
    name: aide
    state: present

- name: "{{{ rule_title }}} - Set-fact aide config file and forbidden hashes"
  ansible.builtin.set_fact:
    aide_conf: "{{{ aide_conf_path }}}"
    forbidden_hashes:
      - sha1
      - rmd160
      - sha256
      - whirlpool
      - tiger
      - haval
      - gost
      - crc32

- name: "{{{ rule_title }}} - Gather the package facts"
  ansible.builtin.package_facts:
    manager: auto

{{% if 'debian' in product or 'ubuntu' in product %}}
{{#- A group that hashes with a forbidden hash keeps hashing, with sha512,
    instead of being left empty; groups without a hash stay without one. #}}
- name: "{{{ rule_title }}} - Use sha512 in groups that hash with a forbidden hash"
  ansible.builtin.replace:
    path: "{{ aide_conf }}"
    regexp: '^(\s*[A-Z][A-Za-z_]*\s*=(?!.*\bsha512\b).*?)\b(?:{{ forbidden_hashes | join("|") }})\b'
    replace: '\1sha512'
  when:
    - '"aide" in ansible_facts.packages'

{{% endif %}}
- name: "{{{ rule_title }}} - Remove forbidden hashes"
  ansible.builtin.replace:
    path: "{{ aide_conf }}"
    regexp: '(^\s*[A-Z][A-Za-z_]*\s*=.*?)({{ item }}\+|\+?{{ item }})(.*)'
    replace: '\1\3'
  when:
    - '"aide" in ansible_facts.packages'
  loop: "{{ forbidden_hashes }}"

{{% if 'debian' in product or 'ubuntu' in product %}}
{{#- Debian and Ubuntu hash files through the Checksums group, which the content
    groups include; set it to sha512 only. #}}
- name: "{{{ rule_title }}} - Set Checksums to sha512"
  ansible.builtin.lineinfile:
    path: "{{ aide_conf }}"
    regexp: '^Checksums\s*='
    line: 'Checksums = sha512'
  when:
    - '"aide" in ansible_facts.packages'
{{% else %}}
- name: "{{{ rule_title }}} - Set sha512"
  ansible.builtin.replace:
    path: "{{ aide_conf }}"
    regexp: '(^\s*[A-Z][A-Za-z_]*\s*=)((?:(?!\+?sha512).)*)\s*$'
    replace: '\1\2+sha512'
  when:
    - '"aide" in ansible_facts.packages'
{{% endif %}}
