# platform = multi_platform_debian
# reboot = false
# strategy = enable
# complexity = low
# disruption = low

{{#- Debian's aide.conf hashes files through one group, Checksums (H, every
    compiled-in hash, by default); the other groups are attribute sets that
    deliberately carry no hash. So set Checksums to sha512 alone rather than
    appending sha512 to every group. #}}

- name: "{{{ rule_title }}} - Ensure aide is installed"
  ansible.builtin.package:
    name: aide
    state: present

- name: "{{{ rule_title }}} - Set Checksums to sha512 in {{{ aide_conf_path }}}"
  ansible.builtin.lineinfile:
    path: "{{{ aide_conf_path }}}"
    regexp: '^Checksums\s*='
    line: 'Checksums = sha512'
    create: true
    mode: '0644'
