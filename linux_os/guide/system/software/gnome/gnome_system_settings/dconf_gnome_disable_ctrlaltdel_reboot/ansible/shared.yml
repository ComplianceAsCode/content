# platform = multi_platform_almalinux,multi_platform_fedora,multi_platform_ol,multi_platform_opensuse,multi_platform_rhel
# reboot = false
# strategy = unknown
# complexity = low
# disruption = medium
- name: "Disable Ctrl-Alt-Del Reboot Key Sequence in GNOME3"
  community.general.ini_file:
{{% if product in ['opensuse16', 'sle15', 'sle16'] %}}
    dest: /etc/dconf/db/{{{ dconf_gdm_dir }}}/00-security-settings
{{% else %}}
    dest: /etc/dconf/db/local.d/00-security-settings
{{% endif %}}
    section: org/gnome/settings-daemon/plugins/media-keys
    option: logout
    value: "['']"
    create: yes
    no_extra_spaces: yes
    mode: 0644
  register: result_ini

- name: "Prevent user modification of GNOME disablement of Ctrl-Alt-Del"
  ansible.builtin.lineinfile:
{{% if product in ['opensuse16', 'sle15', 'sle16'] %}}
    path: /etc/dconf/db/{{{ dconf_gdm_dir }}}/locks/00-security-settings-lock
{{% else %}}
    path: /etc/dconf/db/local.d/locks/00-security-settings-lock
{{% endif %}}
    regexp: '^/org/gnome/settings-daemon/plugins/media-keys/logout$'
    line: '/org/gnome/settings-daemon/plugins/media-keys/logout'
    create: yes
    mode: 0644
  register: result_lineinfile

- name: Dconf Update
  ansible.builtin.command: dconf update
  when: result_ini is changed or result_lineinfile is changed

{{% if product in ['opensuse16', 'sle15', 'sle16'] %}}
{{{ ansible_enable_dconf_user_profile(profile="gdm", database="gdm") }}}
{{% endif %}}
