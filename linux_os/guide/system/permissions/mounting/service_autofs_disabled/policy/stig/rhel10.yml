srg_requirement: |-
    {{{ full_name }}} must disable file system automount function.

fixtext: |-
    Configure {{{ full_name }}} to disable the ability to automount devices.

    The "autofs" service can be disabled with the following command:

    $ sudo systemctl mask --now autofs.service

checktext: |-
    Note: If the "autofs" service is not installed, this requirement is not applicable.

    Verify {{{ full_name }}} is configured so that the file system automount function has been disabled with the following command:

    $ systemctl is-enabled  autofs
    not-found

    If the returned value is not "masked", "disabled", or "not-found", this is a finding.

vuldiscussion: |-
    Without identifying devices, unidentified or unknown devices may be introduced, thereby facilitating malicious activity.

    Peripherals include, but are not limited to, such devices as flash drives, external storage, and printers.

