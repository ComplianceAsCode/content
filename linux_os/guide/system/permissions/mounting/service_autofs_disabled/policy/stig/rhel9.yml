srg_requirement: |-
    The {{{ full_name }}} file system automounter must be disabled.

vuldiscussion: |-
    Without identifying devices, unidentified or unknown devices may be introduced, thereby facilitating malicious activity.

    Peripherals include, but are not limited to, devices such as flash drives, external storage, and printers.

checktext: |-
    Verify that {{{ full_name }}} file system automount function has been disabled and masked with the following command:

    $ systemctl is-enabled  autofs
    masked

    If the returned value is not "masked", "disabled", or "not-found", this is a finding.

fixtext: |-
    Configure {{{ full_name }}} to disable and mask the ability to automount devices.

    The "autofs" service can be disabled with the following command:

    $ sudo systemctl mask --now autofs.service
