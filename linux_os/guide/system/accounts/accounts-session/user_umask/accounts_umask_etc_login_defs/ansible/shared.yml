# platform = multi_platform_all
# reboot = false
# disruption = low
# strategy = restrict
# complexity = low
{{{ ansible_instantiate_variables("var_accounts_user_umask") }}}

{{% if product in [ 'slmicro6', 'sle15', 'sle16' ] %}}
{{% set accounts_umask_etc_login_defs_cce_identifier = cce_identifiers['cce'] %}}
{{{
    ansible_login_defs(
      parameter='UMASK',
      value='{{ var_accounts_user_umask }}',
      rule_title=rule_title,
      cce=accounts_umask_etc_login_defs_cce_identifier
    )
}}}
{{% else %}}
- name: Set default umask
  ansible.builtin.lineinfile:
    path: {{{ login_defs_path }}}
    regexp: ^(\s*)UMASK\s+.*
    state: absent
  check_mode: true
  changed_when: false
  register: result_umask_is_set

- name: Replace user UMASK in {{{ login_defs_path }}}
  ansible.builtin.replace:
    path: {{{ login_defs_path }}}
    regexp: ^(\s*)UMASK(\s+).*
    replace: \g<1>UMASK\g<2>{{ var_accounts_user_umask }}
  when:
    - result_umask_is_set.found > 0

- name: Ensure the Default UMASK is Appended Correctly
  ansible.builtin.lineinfile:
    create: true
    path: {{{ login_defs_path }}}
    line: UMASK {{ var_accounts_user_umask }}
    mode: 0644
  when:
    - result_umask_is_set.found == 0
{{% endif %}}

