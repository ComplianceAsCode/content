documentation_complete: true

title: 'Configure Local Interactive User Dot Directory Ownership'

description: |-
    Dot directories below each local interactive user's home directory must be
    owned by that user.

rationale: |-
    Unexpected ownership can allow one account to control another account's
    configuration or authentication data.

severity: medium

platform: system_with_kernel

ocil_clause: 'a dot directory has an unexpected owner'

ocil: |-
    For each local interactive user, recursively inspect dot directories on the
    local filesystem below that user's home directory. Every directory must be
    owned by that user.
