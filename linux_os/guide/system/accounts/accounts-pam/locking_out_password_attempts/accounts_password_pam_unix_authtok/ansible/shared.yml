# platform = multi_platform_all
# reboot = false
# strategy = configure
# complexity = low
# disruption = medium
{{% if 'debian' in product or 'ubuntu' in product or 'sle' in product or 'slmicro' in product %}}
{{{ ansible_ensure_pam_module_option("/etc/pam.d/common-password", "password", "sufficient", "pam_unix.so", "use_authtok", rule_id=rule_id, rule_title=rule_title) }}}
{{% else %}}
{{{ ansible_check_authselect_presence(rule_title=rule_title) }}}
{{{ ansible_ensure_pam_module_option("/etc/pam.d/system-auth", "password", "sufficient", "pam_unix.so", "use_authtok", rule_id=rule_id, rule_title=rule_title) }}}
{{{ ansible_ensure_pam_module_option("/etc/pam.d/password-auth", "password", "sufficient", "pam_unix.so", "use_authtok", rule_id=rule_id, rule_title=rule_title) }}}
{{% endif %}}
