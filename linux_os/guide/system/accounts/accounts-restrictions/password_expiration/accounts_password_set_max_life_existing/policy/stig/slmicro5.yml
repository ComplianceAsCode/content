srg_requirement: |-
    The {{{ full_name }}} user account passwords must have a 180-day maximum password lifetime restriction.

vuldiscussion: |-
    Any password, no matter how complex, can eventually be cracked. Therefore, passwords need to be changed periodically. If {{{ full_name }}} does not limit the lifetime of passwords and force users to change their passwords, there is the risk that {{{ full_name }}} passwords could be compromised.

checktext: |-
    Verify that {{{ full_name }}} enforces a maximum user password age of 180 days or less with the following command:

    $ sudo awk -F: '$5 > 180 || $5 == "" {print $1 ":" $5}' /etc/shadow

    If any results are returned that are not associated with a system account, this is a finding.

fixtext: |-
    Configure {{{ full_name }}} to enforce a maximum password age of each &lt;username&gt; account to 180 days. The command in the check text will give a list of users that need to be updated to be in compliance:

    $ sudo passwd -x 180 &lt;username&gt;
