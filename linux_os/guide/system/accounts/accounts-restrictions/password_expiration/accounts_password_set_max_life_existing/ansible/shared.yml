# platform = multi_platform_almalinux,multi_platform_fedora,multi_platform_ol,multi_platform_rhel,multi_platform_sle,multi_platform_slmicro,multi_platform_ubuntu
# reboot = false
# strategy = restrict
# complexity = low
# disruption = low
{{{ ansible_instantiate_variables("var_accounts_maximum_age_login_defs") }}}

- name: Collect users with not correct maximum time period between password changes
  ansible.builtin.command:
    cmd: awk -F':' '(/^[^:]+:[^!*]/ && ($5 > {{ var_accounts_maximum_age_login_defs }} || $5 == "")) {print $1}' /etc/shadow
  register: user_names
  changed_when: false
  check_mode: false

{{% if product in ["ol7"] %}}
- name: "{{{ rule_title }}} - Change the Maximum Time Period Between Password Changes"
  ansible.builtin.command:
    cmd: chage -M {{ var_accounts_maximum_age_login_defs }} {{ item }}
  changed_when: true
  with_items: '{{ user_names.stdout_lines }}'
  when: user_names.stdout_lines | length > 0
{{% elif 'sle' in product or 'slmicro' in product %}}
- name: "{{{ rule_title }}} - Change the Maximum Time Period Between Password Changes"
  ansible.builtin.command:
    cmd: passwd -q -x {{ var_accounts_maximum_age_login_defs }} {{ item }}
  changed_when: true
  with_items: '{{ user_names.stdout_lines }}'
  when: user_names.stdout_lines | length > 0
{{% else %}}
- name: "{{{ rule_title }}} - Change the Maximum Time Period Between Password Changes"
  ansible.builtin.user:
    user: '{{ item }}'
    password_expire_max: '{{ var_accounts_maximum_age_login_defs }}'
  with_items: '{{ user_names.stdout_lines }}'
  when: user_names.stdout_lines | length > 0
{{% endif %}}
