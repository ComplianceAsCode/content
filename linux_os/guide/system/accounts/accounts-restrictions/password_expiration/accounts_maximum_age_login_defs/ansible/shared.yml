# platform = multi_platform_rhel,multi_platform_fedora,multi_platform_ol,multi_platform_rhv,multi_platform_sle,multi_platform_slmicro,multi_platform_debian,multi_platform_almalinux
# reboot = false
# strategy = restrict
# complexity = low
# disruption = low
{{{ ansible_instantiate_variables("var_accounts_maximum_age_login_defs") }}}

{{% if product in [ 'slmicro6', 'sle15', 'sle16' ] %}}
{{% set cce_cce_identifier = cce_identifiers['cce'] %}}
{{{
    ansible_login_defs(
      parameter='PASS_MAX_DAYS',
      value='{{ var_accounts_maximum_age_login_defs }}',
      rule_title=rule_title,
      cce=cce_cce_identifier
    )
}}}
{{% else %}}
- name: Set Password Maximum Age
  ansible.builtin.lineinfile:
    create: yes
    dest: {{{ login_defs_path }}}
    regexp: ^PASS_MAX_DAYS
    line: "PASS_MAX_DAYS {{ var_accounts_maximum_age_login_defs }}"
    create: yes
{{% endif %}}
