srg_requirement: |-
    {{{ full_name }}} must have the "pkcs11-provider" package installed.

vuldiscussion: |-
    Without the use of multifactor authentication (MFA), the ease of access to privileged functions is greatly increased. MFA requires using two or more factors to achieve authentication. A privileged account is defined as an information system account with authorizations of a privileged user. The DoW common access card (CAC) with DoW-approved PKI is an example of MFA.



checktext: |-
    Note: If the system administrator demonstrates the use of an approved alternate multifactor authentication method, this requirement is not applicable.

    Verify {{{ full_name }}} has the "pkcs11-provider" package installed with the following command:

    $ sudo dnf list --installed pkcs11-provider
    Installed Packages
    pkcs11-provider.x86_64                           1.0-3.el10_0                            @rhel-10-for-x86_64-baseos-rpms

    If the "pkcs11-provider" package is not installed, this is a finding.

fixtext: |-
    Configure {{{ full_name }}} to have the "pkcs11-provider" package installed with the following command:

    $ sudo dnf -y install pkcs11-provider



