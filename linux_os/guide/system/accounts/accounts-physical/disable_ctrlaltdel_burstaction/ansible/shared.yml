# platform = multi_platform_all
# reboot = false
# strategy = disable
# complexity = low
# disruption = low

{{% if "rhel" in families %}}
- name: Create the systemd configuration drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    mode: '0755'

{{{ ansible_ini_file_set("/etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf", "Manager", "CtrlAltDelBurstAction", "none", no_extra_spaces=True, description="Disable Ctrl-Alt-Del Burst Action") }}}

- name: Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true
{{% else %}}
- name: Disable Ctrl-Alt-Del Burst Action
  ansible.builtin.lineinfile:
    dest: /etc/systemd/system.conf
    state: present
    regexp: ^CtrlAltDelBurstAction
    line: "CtrlAltDelBurstAction=none"
    create: yes
    mode: 0644
{{% endif %}}
