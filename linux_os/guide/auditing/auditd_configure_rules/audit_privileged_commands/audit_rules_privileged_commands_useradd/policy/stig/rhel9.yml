srg_requirement: |-
    {{{ full_name }}} must audit all uses of the useradd command.

vuldiscussion: |-
    Without generating audit records specific to the security and mission needs of the organization, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

    Audit records can be generated from various components within the information system.

    When a user logs on, the AUID is set to the UID of the account being authenticated. Daemons are not user sessions and have the loginuid set to -1. The audit system interprets -1, 4294967295, and "unset" in the same way.

checktext: |-
    Verify {{{ full_name }}} is configured to audit execution of the "useradd" command with the following command:

    $ sudo auditctl -l | grep useradd

    -a always,exit -F path=/usr/sbin/useradd -F perm=x -F auid&gt;={{{ uid_min }}} -F auid!=-1 -F key=privileged-useradd

    If the command does not return a line, or the line is commented out, this is a finding.

fixtext: |-
    Configure {{{ full_name }}} to generate audit records upon successful or unsuccessful attempts to use the "useradd" command by adding or updating the following rule in "/etc/audit/rules.d/audit.rules":

    -a always,exit -F path=/usr/sbin/useradd -F perm=x -F auid&gt;={{{ uid_min }}} -F auid!=unset -k privileged-useradd

    To load the rules to the kernel immediately, use the following command:

    $ sudo augenrules --load
