srg_requirement: |-
    {{{ full_name }}} must generate an audit record for all successful and unsuccessful uses of the useradd command.

vuldiscussion: |-
    Without generating audit records that are specific to the security and mission needs of the organization, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

    Audit records can be generated from various components within the information system (e.g., module or policy filter). The useradd command modifies the system account files to reflect the changes that are specified on the command line.

    When a user logs on, the AUID is set to the UID of the account that is being authenticated. Daemons are not user sessions and have the loginuid set to -1. The AUID representation is an unsigned 32-bit integer, which equals 4294967295. The audit system interprets -1, 4294967295, and "unset" in the same way.

checktext: |-
    Verify {{{ full_name }}} generates an audit record for any successful and unsuccessful use of the "useradd" command by performing the following command to check the file system rules in "/etc/audit/audit.rules":

    $ grep -w useradd /etc/audit/audit.rules

    -a always,exit -F path=/usr/sbin/useradd -F perm=x -F auid&gt;={{{ uid_min }}} -F auid!=unset -k privileged-useradd

    If the command does not return a line, or the line is commented out, this is a finding.

fixtext: |-
    Configure {{{ full_name }}} to generate an audit event for any successful and unsuccessful uses of the "useradd" command by adding or updating the following rule in the "/etc/audit/rules.d/audit.rules" file:

    -a always,exit -F path=/usr/sbin/useradd -F perm=x -F auid&gt;={{{ uid_min }}} -F auid!=unset -k privileged-useradd

    The audit daemon must be restarted for the changes to take effect.

    $ service auditd restart
