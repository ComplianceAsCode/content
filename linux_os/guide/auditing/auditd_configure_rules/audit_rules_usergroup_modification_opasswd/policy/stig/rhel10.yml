srg_requirement: |-
    {{{ full_name }}} must generate audit records for all account creations, modifications, disabling, and termination events that affect "/etc/security/opasswd".

fixtext: |-
    Configure {{{ full_name }}} to generate audit records for all modifications to "/etc/security/opasswd" by adding or updating the following rules in "/etc/audit/rules.d/identity.rules":

    -a always,exit -F arch=b32 -F path=/etc/security/opasswd -F perm=wa -k identity
    -a always,exit -F arch=b64 -F path=/etc/security/opasswd -F perm=wa -k identity

    To load the rules to the kernel immediately, use the following command:

    $ sudo augenrules --load

checktext: |-
    Verify {{{ full_name }}} generates audit records for modifications to "/etc/security/opasswd" with the following command:

    $ sudo auditctl -l | grep '/etc/security/opasswd'

    -a always,exit -F arch=b32 -F path=/etc/security/opasswd -F perm=wa -F key=identity
    -a always,exit -F arch=b64 -F path=/etc/security/opasswd -F perm=wa -F key=identity

    If the command does not return these lines, or the lines are commented out, this is a finding.

vuldiscussion: |-
    In addition to auditing new user and group accounts, these watches will alert the system administrator(s) to any modifications. Any unexpected users, groups, or modifications should be investigated for legitimacy.


