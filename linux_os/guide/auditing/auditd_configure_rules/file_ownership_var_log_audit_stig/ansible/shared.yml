# platform = multi_platform_rhel,multi_platform_sle,multi_platform_ubuntu
# reboot = false
# strategy = restrict
# complexity = low
# disruption = low

{{{ ansible_auditd_set_log_file_fact(rule_title=rule_title) }}}

- name: "{{{ rule_title }}} - Find Audit Log Files"
  ansible.builtin.find:
      paths: "{{ audit_log_file_path | dirname }}"
      patterns:
          - "{{ audit_log_file_path | basename }}"
          - "{{ audit_log_file_path | basename }}.*"
      file_type: file
      hidden: true
  register: audit_log_files

- name: "{{{ rule_title }}} - Ensure Audit Log Files Are Owned by Root"
  ansible.builtin.file:
      path: "{{ item.path }}"
      owner: root
      state: file
  loop: "{{ audit_log_files.files }}"
