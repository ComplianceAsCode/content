documentation_complete: true


title: 'Configure auditing of systemctl executions (ppc64le)'

{{% set file_contents_audit_service_management =
"## These rules watch for execution of the systemctl command by users.
## Any use of systemctl to manage system services is audited.
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/systemctl -F perm=x -F auid>=" ~ uid_min ~ " -F auid!=unset -F key=service-management" %}}

description: |-
    Ensure that executions of the <tt>systemctl</tt> command are audited.

    The following rules configure audit as described above:
    <pre>{{{ file_contents_audit_service_management|indent }}}    </pre>

    Load new Audit rules into kernel by running:
    <pre>augenrules --load</pre>

rationale: |-
    The <tt>systemctl</tt> command is used to manage system services, including
    security-relevant ones such as the audit daemon itself. An attacker could use it
    to stop or reconfigure these services in order to disrupt the system or to cover
    their tracks. Having these events audited helps in monitoring and investigating
    of malicious activities.

severity: medium

platforms:
    - ppc64le_arch

identifiers:
    cce@rhel9: CCE-86501-4
    cce@rhel10: CCE-86527-9

ocil_clause: 'the file does not exist or the content differs'

ocil: |-
    To verify that the <tt>Audit</tt> is correctly configured according to recommended rules, check the content of the file with the following command:
    <pre>cat /etc/audit/rules.d/30-ospp-v42-7-service-management.rules</pre>
    The output has to be exactly as follows:
    <pre>{{{ file_contents_audit_service_management|indent }}}    </pre>

template:
    name: audit_file_contents
    vars:
        filepath: /etc/audit/rules.d/30-ospp-v42-7-service-management.rules
        contents: |-
            {{{ file_contents_audit_service_management|indent(12) }}}
