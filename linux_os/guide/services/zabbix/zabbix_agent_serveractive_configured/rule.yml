documentation_complete: true

title: 'Ensure Zabbix Agent ServerActive Directive Is Configured'

description: |-
    The Zabbix agent must be configured to actively report to the Zabbix
    server corresponding to the network segment the host is on, by
    editing <tt>ServerActive</tt> in
    <tt>/etc/zabbix/zabbix_agentd.conf</tt>:
    <pre>ServerActive=&lt;zabbix_server_address&gt;</pre>

rationale: |-
    Leaving <tt>ServerActive</tt> at its packaged default
    (<tt>127.0.0.1</tt>) means the agent does not actively report to any
    real monitoring server, so active checks and trapper data never
    reach it.

severity: medium

warnings:
    - general: |-
        This rule doesn't come with a remediation; the correct Zabbix
        server address depends on the network segment the host is on and
        needs to be set by the administrator.

ocil_clause: 'ServerActive is missing or left at the packaged default'

ocil: |-
    Run the following command:
    <pre># grep -E '^ServerActive=' /etc/zabbix/zabbix_agentd.conf</pre>
    <tt>ServerActive</tt> should be present and set to the Zabbix server
    address for this network segment, not left at the packaged default of
    <tt>127.0.0.1</tt>.

fixtext: |-
    Edit <tt>/etc/zabbix/zabbix_agentd.conf</tt> and set
    <tt>ServerActive</tt> to the Zabbix server address for this network
    segment. Restart the service:
    <pre># systemctl restart zabbix-agent.service</pre>
