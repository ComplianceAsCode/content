default:
  aide_audit_binaries:
    - "auditctl"
    - "auditd"
    - "ausearch"
    - "aureport"
    {{% if product not in ['rhel10', 'ol10', 'sle16', 'fedora', 'opensuse'] %}}
    - "autrace"
    {{% endif %}}
    {{% if 'rhel' not in product and 'ol' not in families and 'debian' not in families and 'ubuntu' not in families and 'almalinux' not in product %}}
    - "audispd"
    {{% endif %}}
    {{% if 'ol' in families %}}
    - "rsyslogd"
    {{% endif %}}
    - "augenrules"
    {{% if 'suse' in families %}}
    - "audisp-syslog"
    {{% endif %}}
    {{% if product in ['opensuse16', 'sle16'] %}}
    - audisp-remote
    - audispd-zos-remote
    {{% endif %}}
