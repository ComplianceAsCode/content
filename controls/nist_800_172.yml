# NIST SP 800-172 Revision 3 - Enhanced Security Requirements for Protecting CUI
#
# Derived from the official NIST SP 800-172 Revision 3 publication (final,
# May 2026), Appendix C "Summary of Enhanced Security Requirements" (Table 2),
# with each enhanced requirement mapped to the NIST 800-53 control it is
# sourced from.
#
# IMPORTANT: 800-172's enhanced requirements supplement NIST SP 800-171 - they
# are implemented IN ADDITION TO the 800-171 baseline, and SP 800-172 assumes
# 800-171 is already satisfied (SP 800-172r3 Sec. 2.1 / p.10). This file
# therefore contains ONLY the enhanced ("E") requirements; it does not
# duplicate 800-171's foundational requirements (see controls/nist_800_171.yml).
# A deployable profile is expected to select both policies together.
#
# Enhanced requirements that NIST marked "Withdrawn" in Table 2 are omitted.
#
# This is a single, product-agnostic control file, following the same pattern
# as nist_800_171.yml. Each requirement does NOT list rules directly; instead
# it references (via the 'controls:' list) the NIST 800-53 control it was
# sourced from. At build time these cross-policy references resolve against
# the *current product's* nist_800_53 control file, so each requirement
# inherits the rules mapped to its source 800-53 control for that product.
# Products without a nist_800_53 policy resolve to no rules.
#
# Most enhanced requirements address organizational, procedural, or
# architectural safeguards (e.g. dual authorization, threat hunting, SOC,
# decoys, supply chain) rather than host configuration, so their source
# 800-53 control(s) carry no RHEL rules today; those requirements are marked
# 'status: pending' (same convention nist_800_53.yml itself uses for
# not-yet-automated controls), while the few that do resolve to rules are
# marked 'status: automated'.
