# NIST SP 800-171 Revision 3 - Protecting Controlled Unclassified Information
#
# Derived from the official NIST SP 800-171 Revision 3 publication, with each
# requirement mapped to the NIST 800-53 controls it was tailored from.
#
# This is a single, product-agnostic control file. Each 800-171 requirement
# does NOT list rules directly; instead it references (via the 'controls:'
# list) the NIST 800-53 controls it was tailored from. At build time these
# cross-policy references resolve against the *current product's* nist_800_53
# control file, so each requirement inherits the union of rules mapped to its
# source 800-53 controls for that product. Products without a nist_800_53
# policy resolve to no rules.
policy: NIST SP 800-171 Revision 3
title: NIST Special Publication 800-171 Revision 3
id: nist_800_171
version: Revision 3
source: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/800-171r3/NIST.SP.800-171r3.html
