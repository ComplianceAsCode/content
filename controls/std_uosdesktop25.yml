---
policy: 'Standard Benchmark for UOS Desktop 25'
title: 'Standard Benchmark for UOS Desktop 25'
id: std_uosdesktop25
version: '1.0'

levels:
    - id: l1_desktop
    - id: l2_desktop
      inherits_from:
          - l1_desktop

controls:
    - id: 1.1.1
      title: Ensure All Files Have Owner And Group
      levels:
          - l1_desktop
      status: automated
      rules:
          - no_files_unowned_by_user
          - file_permissions_ungroupowned

    - id: 1.1.2
      title: Ensure Sticky Set On Global Writable Folder
      levels:
          - l1_desktop
      status: automated
      rules:
          - dir_perms_world_writable_sticky_bits

    - id: 1.1.3
      title: Ensure UMASK Correct
      levels:
          - l1_desktop
      status: automated
      rules:
          - accounts_umask_etc_bashrc
          - var_accounts_user_umask=027

    - id: 1.1.4
      title: Ensure No Global Writable File
      levels:
          - l1_desktop
      status: automated
      rules:
          - file_permissions_unauthorized_world_writable

    - id: 2.1.1
      title: Ensure rsync Service Disabled
      levels:
          - l1_desktop
      status: automated
      rules:
          - service_rsyncd_disabled

    - id: 2.2.1
      title: Ensure X11 Forwarding Disabled
      levels:
          - l1_desktop
      status: automated
      rules:
          - sshd_disable_x11_forwarding

    - id: 2.2.2
      title: Ensure SSH MaxAuthTries Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - sshd_set_max_auth_tries
          - sshd_max_auth_tries_value=4

    - id: 2.2.3
      title: Ensure SSH MaxStartups Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - sshd_set_maxstartups
          - var_sshd_set_maxstartups=10:30:60

    - id: 2.2.4
      title: Ensure SSH LoginGraceTime Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - sshd_set_login_grace_time
          - var_sshd_set_login_grace_time=60

    - id: 2.2.5
      title: Ensure SSH Idle Timeout Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - sshd_set_keepalive
          - var_sshd_set_keepalive=1

    - id: 2.3.1
      title: Ensure SSH Root Login Disabled
      levels:
          - l1_desktop
      status: automated
      rules:
          - sshd_disable_root_login

    - id: 2.3.2
      title: Ensure SSH Empty Passwords Disabled
      levels:
          - l1_desktop
      status: automated
      rules:
          - sshd_disable_empty_passwords

    - id: 3.1.1
      title: Ensure auditd Installed And Enabled
      levels:
          - l1_desktop
      status: automated
      rules:
          - package_audit_installed
          - service_auditd_enabled

    - id: 3.2.1
      title: Ensure Logging Configured For rsyslog
      levels:
          - l1_desktop
      status: automated
      rules:
          - rsyslog_files_permissions
          - rsyslog_files_ownership
          - rsyslog_files_groupownership

    - id: 3.2.2
      title: Ensure Logrotate Activated
      levels:
          - l1_desktop
      status: automated
      rules:
          - ensure_logrotate_activated

    - id: 4.1.1
      title: Ensure Password Expiration Is Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - accounts_maximum_age_login_defs
          - var_accounts_maximum_age_login_defs=90

    - id: 4.1.2
      title: Ensure Minimum Days Between Password Changes
      levels:
          - l1_desktop
      status: automated
      rules:
          - accounts_minimum_age_login_defs
          - var_accounts_minimum_age_login_defs=7

    - id: 4.1.3
      title: Ensure Password Expiration Warning Days Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - accounts_password_warn_age_login_defs
          - var_accounts_password_warn_age_login_defs=7

    - id: 4.1.4
      title: Ensure Strong Password Hashing Algorithm
      levels:
          - l1_desktop
      status: automated
      rules:
          - set_password_hashing_algorithm_systemauth
          - set_password_hashing_algorithm_passwordauth

    - id: 5.1.1
      title: Ensure Permissions On /etc/passwd Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - file_permissions_etc_passwd
          - file_owner_etc_passwd
          - file_groupowner_etc_passwd

    - id: 5.1.2
      title: Ensure Permissions On /etc/shadow Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - file_permissions_etc_shadow
          - file_owner_etc_shadow
          - file_groupowner_etc_shadow

    - id: 5.1.3
      title: Ensure Permissions On /etc/gshadow Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - file_permissions_etc_gshadow
          - file_owner_etc_gshadow
          - file_groupowner_etc_gshadow

    - id: 5.1.4
      title: Ensure Permissions On /etc/group Configured
      levels:
          - l1_desktop
      status: automated
      rules:
          - file_permissions_etc_group
          - file_owner_etc_group
          - file_groupowner_etc_group

    - id: 5.1.5
      title: Ensure Permissions On SSH Private Host Key Files
      levels:
          - l1_desktop
      status: automated
      rules:
          - file_permissions_sshd_private_key

    - id: 6.1.1
      title: Ensure AIDE Is Installed
      levels:
          - l2_desktop
      status: automated
      rules:
          - package_aide_installed

    - id: 6.2.1
      title: Ensure Accounts In /etc/passwd Use Shadowed Passwords
      levels:
          - l1_desktop
      status: automated
      rules:
          - accounts_password_all_shadowed

    - id: 6.2.2
      title: Ensure Root Is Only UID 0 Account
      levels:
          - l1_desktop
      status: automated
      rules:
          - accounts_no_uid_except_zero

    - id: 6.3.1
      title: Ensure Kernel Randomize VA Space Enabled
      levels:
          - l1_desktop
      status: automated
      rules:
          - sysctl_kernel_randomize_va_space

    - id: 6.3.2
      title: Ensure FS Protected Symlinks Enabled
      levels:
          - l1_desktop
      status: automated
      rules:
          - sysctl_fs_protected_symlinks

    - id: 6.3.3
      title: Ensure FS Protected Hardlinks Enabled
      levels:
          - l1_desktop
      status: automated
      rules:
          - sysctl_fs_protected_hardlinks
