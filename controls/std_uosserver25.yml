---
policy: 'Standard Benchmark for UOS Server 25'
title: 'Standard Benchmark for UOS Server 25'
id: std_uosserver25
version: '1.0'

levels:
    - id: l1_server
    - id: l2_server
      inherits_from:
          - l1_server

controls:
    - id: 1.1.1
      title: Ensure All Files Have Owner And Group
      levels:
          - l1_server
      status: automated
      rules:
          - no_files_unowned_by_user
          - no_files_unowned_by_user.severity=high
          - file_permissions_ungroupowned
          - file_permissions_ungroupowned.severity=high

    - id: 1.1.2
      title: Ensure No Hidden Executable Files
      levels:
          - l1_server
      status: automated
      rules:
          - no_files_unowned_by_user

    - id: 1.1.3
      title: Ensure Sticky Set On Global Writable Folder
      levels:
          - l1_server
      status: automated
      rules:
          - dir_perms_world_writable_sticky_bits
          - dir_perms_world_writable_sticky_bits.severity=high

    - id: 1.1.4
      title: Ensure UMASK Correct
      levels:
          - l1_server
      status: automated
      rules:
          - accounts_umask_etc_bashrc
          - accounts_umask_etc_bashrc.severity=high
          - var_accounts_user_umask=027

    - id: 1.1.5
      title: Ensure No Global Writable File
      levels:
          - l1_server
      status: automated
      rules:
          - file_permissions_unauthorized_world_writable

    - id: 2.1.1
      title: Ensure cohana/inetd Services Disabled
      levels:
          - l1_server
      status: automated
      rules:
          - service_rsyncd_disabled
          - service_rsyncd_disabled.severity=low

    - id: 2.2.1
      title: Ensure X11 Forwarding Disabled
      levels:
          - l1_server
      status: automated
      rules:
          - sshd_disable_x11_forwarding
          - sshd_disable_x11_forwarding.severity=high

    - id: 2.2.2
      title: Ensure SSH MaxAuthTries Configured
      levels:
          - l1_server
      status: automated
      rules:
          - sshd_set_max_auth_tries
          - sshd_max_auth_tries_value=4

    - id: 2.2.3
      title: Ensure SSH MaxStartups Configured
      levels:
          - l1_server
      status: automated
      rules:
          - sshd_set_maxstartups
          - var_sshd_set_maxstartups=10:30:60

    - id: 2.2.4
      title: Ensure SSH LoginGraceTime Configured
      levels:
          - l1_server
      status: automated
      rules:
          - sshd_set_login_grace_time
          - var_sshd_set_login_grace_time=60

    - id: 2.2.5
      title: Ensure SSH Idle Timeout Configured
      levels:
          - l1_server
      status: automated
      rules:
          - sshd_set_keepalive
          - sshd_set_keepalive.severity=high
          - var_sshd_set_keepalive=1

    - id: 3.1.1
      title: Ensure auditd Installed And Enabled
      levels:
          - l1_server
      status: automated
      rules:
          - package_audit_installed
          - service_auditd_enabled

    - id: 3.1.2
      title: Ensure auditd Service Enabled
      levels:
          - l1_server
      status: automated
      rules:
          - service_auditd_enabled

    - id: 3.2.1
      title: Ensure Logging Configured For rsyslog
      levels:
          - l1_server
      status: automated
      rules:
          - rsyslog_files_permissions

    - id: 4.1.1
      title: Ensure Password Expiration Is Configured
      levels:
          - l1_server
      status: automated
      rules:
          - accounts_maximum_age_login_defs
          - var_accounts_maximum_age_login_defs=90

    - id: 4.1.2
      title: Ensure Minimum Days Between Password Changes
      levels:
          - l1_server
      status: automated
      rules:
          - accounts_minimum_age_login_defs
          - var_accounts_minimum_age_login_defs=7

    - id: 4.1.3
      title: Ensure Password Expiration Warning Days Configured
      levels:
          - l1_server
      status: automated
      rules:
          - accounts_password_warn_age_login_defs
          - var_accounts_password_warn_age_login_defs=7

    - id: 4.1.4
      title: Ensure Strong Password Hashing Algorithm
      levels:
          - l1_server
      status: automated
      rules:
          - set_password_hashing_algorithm_systemauth
          - set_password_hashing_algorithm_passwordauth

    - id: 4.2.1
      title: Ensure Root Login Restricted To System Console
      levels:
          - l1_server
      status: automated
      rules:
          - securetty_root_login_console_only

    - id: 4.2.2
      title: Ensure Root Login Limited
      levels:
          - l1_server
      status: automated
      rules:
          - require_singleuser_auth

    - id: 5.1.1
      title: Ensure Permissions On /etc/passwd Configured
      levels:
          - l1_server
      status: automated
      rules:
          - file_permissions_etc_passwd

    - id: 5.1.2
      title: Ensure Permissions On /etc/shadow Configured
      levels:
          - l1_server
      status: automated
      rules:
          - file_permissions_etc_shadow

    - id: 5.1.3
      title: Ensure Permissions On /etc/gshadow Configured
      levels:
          - l1_server
      status: automated
      rules:
          - file_permissions_etc_gshadow

    - id: 5.1.4
      title: Ensure Permissions On /etc/group Configured
      levels:
          - l1_server
      status: automated
      rules:
          - file_permissions_etc_group

    - id: 5.1.5
      title: Ensure Permissions On /etc/passwd- Configured
      levels:
          - l1_server
      status: automated
      rules:
          - file_permissions_backup_etc_passwd

    - id: 5.1.6
      title: Ensure Permissions On SSH Private Host Key Files
      levels:
          - l1_server
      status: automated
      rules:
          - file_permissions_sshd_private_key

    - id: 6.1.1
      title: Ensure AIDE Is Installed
      levels:
          - l1_server
      status: automated
      rules:
          - package_aide_installed

    - id: 6.2.1
      title: Ensure Accounts In /etc/passwd Use Shadowed Passwords
      levels:
          - l1_server
      status: automated
      rules:
          - accounts_password_all_shadowed

    - id: 6.2.2
      title: Ensure Root Is Only UID 0 Account
      levels:
          - l1_server
      status: automated
      rules:
          - accounts_no_uid_except_zero
