name: Gate (AR / RHEL)
on:
  pull_request:
    branches: [ 'master' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true
jobs:
  validate-fedora-ar:
    name: Build, Lint Ansible Roles on Fedora Latest (Container)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Deps
        run: dnf install -y cmake make ninja-build openscap-utils python3-pyyaml python3-setuptools python3-jinja2 python3-pygithub ansible ansible-lint libxslt git python3-setuptools
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Configure
        run: cmake -DSSG_PRODUCT_RHEL8=ON -DSSG_PRODUCT_RHEL9=ON -DSSG_PRODUCT_RHEL10=ON -G Ninja ..
        working-directory: ./build
      - name: Build
        run: ninja -j$(nproc) rhel10-profile-playbooks rhel9-profile-playbooks rhel8-profile-playbooks
        working-directory: ./build
      - name: Build Ansible Roles
        run: PYTHONPATH=. python3 utils/ansible_playbook_to_role.py --build-playbooks-dir ./build/ansible/ --dry-run ./build/ansible_roles
      # https://github.com/actions/checkout/issues/766
      - name: Set git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint Ansible Roles
        run: ansible-lint -x 204 -x experimental ./build/ansible_roles/*
      - name: Build Ansible Collection (as published downstream)
        run: python3 utils/ansible_roles_to_collection.py --roles-dir ./build/ansible_roles --output-dir ./build/ansible_collection --namespace redhat --collection rhel_hardening_roles
      # The published collection enforces ansible-lint's command-instead-of-module
      # rule for Automation Hub certification. Every command/shell remediation
      # with a module equivalent is rewritten to the vendored ssg_hardening module
      # at assembly time; a new upstream remediation whose command is not mapped
      # would regress certification. Lint the assembled collection with just that
      # rule so the regression fails this pull request instead of surfacing only
      # at publishing time.
      - name: Gate collection on command-instead-of-module (Automation Hub cert rule)
        run: ANSIBLE_COLLECTIONS_PATH="$GITHUB_WORKSPACE/build/ansible_collection" ansible-lint --nocolor --tags command-instead-of-module roles/
        working-directory: ./build/ansible_collection/ansible_collections/redhat/rhel_hardening_roles
