name: Contest Merge Gate

on:
  pull_request_review:
    types: [submitted]
    branches: [master, 'stabilization*']

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-first-approval:
    name: Check for first attributed approval
    if: ${{ github.event.review.state == 'approved' }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Count currently attributed approvals
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Only the latest review per reviewer counts towards an attributed
          # approval. Dismissed approvals report state DISMISSED, so they do not
          # count. We proceed only when the review that triggered this run is the
          # single attributed approval, i.e. there was no approval before it.
          approvals=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate \
            | jq '[.[] | {user: .user.login, state: .state, submitted_at: .submitted_at}]
                  | group_by(.user)
                  | map(sort_by(.submitted_at) | last)
                  | map(select(.state == "APPROVED"))
                  | length')
          echo "Currently attributed approvals: ${approvals}"
          if [[ "${approvals}" -le 1 ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "An approval was already attributed before this one; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  evaluate-content-changes:
    name: Evaluate content changes
    needs: check-first-approval
    if: ${{ needs.check-first-approval.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # This gate does not run CTF itself. It reuses the result already computed
      # by the "Gating" workflow (ctf.yaml) for this PR head SHA. CTF output is a
      # pure function of the diff, so the Gating artifact for this SHA is exactly
      # what we would otherwise recompute. If no result is available (e.g. the
      # Gating run has not finished yet or its artifact expired), the gate skips
      # evaluation and the comment asks the reviewer to re-run once it is ready.
      - name: Find Gating run for the PR head SHA
        id: ctf_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api \
            "repos/${REPO}/actions/workflows/ctf.yaml/runs?head_sha=${HEAD_SHA}&status=success" \
            --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')
          if [[ -n "${run_id}" ]]; then
            echo "Found Gating run ${run_id} for ${HEAD_SHA}; reusing its CTF output."
            echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          else
            echo "No successful Gating run found for ${HEAD_SHA}; skipping CTF evaluation."
          fi
      - name: Download CTF output from Gating run
        if: ${{ steps.ctf_run.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ctf-output
          run-id: ${{ steps.ctf_run.outputs.run_id }}
          path: .
      - name: Determine whether a CTF result is available
        id: avail
        run: |
          if [[ -f output.json ]]; then
            echo "A CTF result is available for this commit."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CTF result available for this commit; skipping evaluation."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for content changes
        id: ctf
        if: ${{ steps.avail.outputs.available == 'true' }}
        run: echo "CTF_OUTPUT_SIZE=$(stat --printf="%s" output.json)" >> "$GITHUB_OUTPUT"
      - name: Print changes to content detected if any
        if: ${{ steps.ctf.outputs.CTF_OUTPUT_SIZE != '0' && steps.ctf.outputs.CTF_OUTPUT_SIZE != '' }}
        run: cat output.json
      - name: Get product attribute
        id: product
        if: ${{ steps.ctf.outputs.CTF_OUTPUT_SIZE != '0' && steps.ctf.outputs.CTF_OUTPUT_SIZE != '' }}
        uses: notiz-dev/github-action-json-property@a5a9c668b16513c737c3e1f8956772c99c73f6e8 # v0.2.0
        with:
          path: 'output.json'
          prop_path: 'product'
      - name: Prepare pull request comment
        id: comment
        if: always()
        env:
          CTF_OUTPUT_SIZE: ${{ steps.ctf.outputs.CTF_OUTPUT_SIZE }}
          PRODUCT: ${{ steps.product.outputs.prop }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            if [[ "${CTF_OUTPUT_SIZE}" == "0" ]]; then
              echo "### Contest Merge Gate: no content changes detected"
              echo
              echo "CTF did not detect changes that affect the built content in this pull request, so Contest tests are not required before merging."
              echo
              echo "If you still want to run them, trigger the suite by commenting \`/packit test -i contest-all\`."
            elif [[ -n "${CTF_OUTPUT_SIZE}" ]]; then
              echo "### Contest Merge Gate: content changes detected"
              echo
              echo "CTF detected changes that affect the built content (product: \`${PRODUCT}\`), so Contest tests should be run before merging by commenting \`/packit test -i contest-all\`."
              echo
              echo "Details: ${RUN_URL}"
            else
              echo "### Contest Merge Gate: no automated recommendation"
              echo
              echo "No Content Test Filtering result was available for this commit (the \`Gating\` workflow may not have finished yet, or its result has expired), so the gate could not make an automated recommendation."
              echo
              echo "Please review the changes yourself and decide whether to run the Contest suite by commenting \`/packit test -i contest-all\`."
            fi
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Comment on pull request
        if: always()
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v2
        with:
          message: ${{ steps.comment.outputs.body }}
          comment-tag: contest-merge-gate
          mode: upsert
          pr-number: ${{ github.event.pull_request.number }}
      - name: Evaluate gate result
        id: gate
        if: always()
        env:
          CTF_OUTPUT_SIZE: ${{ steps.ctf.outputs.CTF_OUTPUT_SIZE }}
          PRODUCT: ${{ steps.product.outputs.prop }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${CTF_OUTPUT_SIZE}" == "0" ]]; then
            CONCLUSION=success
            SUMMARY="CTF did not detect content changes. Contest tests are not required. Job: ${RUN_URL}"
          elif [[ -n "${CTF_OUTPUT_SIZE}" ]]; then
            CONCLUSION=success
            SUMMARY="CTF detected content changes${PRODUCT:+ for product ${PRODUCT}}. Contest tests should be run with the packit contest-all command. Job: ${RUN_URL}"
          else
            CONCLUSION=success
            SUMMARY="No CTF result was available for this commit (the Gating workflow may not have finished yet), so no automated recommendation was made. Review the changes and decide whether to run the Contest suite. Job: ${RUN_URL}"
          fi
          OUTPUT=$(jq -cn --arg summary "${SUMMARY}" '{summary: $summary}')
          echo "conclusion=${CONCLUSION}" >> "$GITHUB_OUTPUT"
          echo "output=${OUTPUT}" >> "$GITHUB_OUTPUT"
      - name: Publish Contest Merge Gate check
        if: always()
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Contest Merge Gate
          sha: ${{ github.event.pull_request.head.sha }}
          conclusion: ${{ steps.gate.outputs.conclusion }}
          output: ${{ steps.gate.outputs.output }}
