---
policy: 'Cloud Linux AlmaLinux OS 9 Security Technical Implementation Guide'
title: 'Cloud Linux AlmaLinux OS 9 Security Technical Implementation Guide'
id: stig_almalinux9
source: https://www.cyber.mil/stigs/downloads/
version: V1R8
reference_type: stigid
product: almalinux9

levels:
    - id: high
    - id: medium
    - id: low

controls:
    - id: needed_rules
      levels:
          - medium
      rules:
          - enable_authselect
          - var_authselect_profile=sssd

    - id: ALMA-09-001010
      levels:
          - low
      title: AlmaLinux OS 9 must limit the number of concurrent sessions to ten for all accounts and/or account types.
      rules:
          - accounts_max_concurrent_login_sessions
          - var_accounts_max_concurrent_login_sessions=10
      status: automated

    - id: ALMA-09-001120
      levels:
          - medium
      title: AlmaLinux OS 9 must automatically lock graphical user sessions after 10 minutes of inactivity.
      rules:
          - dconf_gnome_screensaver_idle_delay
          - inactivity_timeout_value=10_minutes
      status: automated

    - id: ALMA-09-001230
      levels:
          - medium
      title: AlmaLinux OS 9 must conceal, via the session lock, information previously visible on the display with a publicly viewable image.
      rules:
          - dconf_gnome_screensaver_mode_blank
      status: automated

    - id: ALMA-09-001340
      levels:
          - medium
      title: AlmaLinux OS 9 must prevent a user from overriding the session idle-delay setting for the graphical user interface.
      rules:
          - dconf_gnome_session_idle_user_locks
      status: automated

    - id: ALMA-09-001450
      levels:
          - medium
      title: AlmaLinux OS 9 must initiate a session lock for graphical user interfaces when the screensaver is activated.
      rules:
          - dconf_gnome_screensaver_lock_delay
          - var_screensaver_lock_delay=5_seconds
      status: automated

    - id: ALMA-09-001560
      levels:
          - medium
      title: AlmaLinux OS 9 must prevent a user from overriding the session lock-delay setting for the graphical user interface.
      rules:
          - dconf_gnome_screensaver_user_locks
      status: automated

    - id: ALMA-09-001890
      levels:
          - medium
      title: AlmaLinux OS 9 must automatically exit interactive command shell user sessions after 10 minutes of inactivity.
      rules:
          - accounts_tmout
          - var_accounts_tmout=10_min
      status: automated

    - id: ALMA-09-002000
      levels:
          - medium
      title: AlmaLinux OS 9 must be able to directly initiate a session lock for all connection types using smart card when the smart card is removed.
      rules:
          - dconf_gnome_lock_screen_on_smartcard_removal
      status: automated

    - id: ALMA-09-002110
      levels:
          - medium
      title: AlmaLinux OS 9 must prevent a user from overriding the disabling of the graphical user smart card removal action.
      rules:
          - dconf_gnome_lock_screen_on_smartcard_removal
      status: automated

    - id: ALMA-09-002770
      levels:
          - medium
      title: AlmaLinux OS 9 must log SSH connection attempts and failures to the server.
      rules:
          - sshd_set_loglevel_verbose
      status: automated

    - id: ALMA-09-002880
      levels:
          - medium
      title: All AlmaLinux OS 9 remote access methods must be monitored.
      rules:
          - rsyslog_remote_access_monitoring
      status: automated

    - id: ALMA-09-002990
      levels:
          - high
      title: AlmaLinux OS 9 SSH client must be configured to use only encryption ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH client connections.
      rules:
          - harden_sshd_ciphers_openssh_conf_crypto_policy
          - sshd_approved_ciphers=stig_almalinux9
      status: automated

    - id: ALMA-09-003210
      levels:
          - high
      title: AlmaLinux OS 9 SSH client must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-3-validated cryptographic hash algorithms.
      rules:
          - harden_sshd_macs_openssh_conf_crypto_policy
          - sshd_approved_macs=stig_almalinux9
      status: automated

    - id: ALMA-09-003320
      levels:
          - high
      title: The AlmaLinux 9 SSH server must be configured to use only DoW-approved encryption ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH server connections.
      rules:
          - harden_sshd_ciphers_opensshserver_conf_crypto_policy
          - sshd_approved_ciphers=stig_almalinux9
      status: automated

    - id: ALMA-09-003430
      levels:
          - medium
      title: AlmaLinux OS 9 must implement DoW-approved systemwide cryptographic policies to protect the confidentiality of SSH server connections.
      rules:
          - sshd_include_crypto_policy
          - file_sshd_50_redhat_exists
      status: automated

    - id: ALMA-09-003540
      levels:
          - high
      title: The AlmaLinux OS 9 SSH server must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH server connections.
      rules:
          - harden_sshd_macs_opensshserver_conf_crypto_policy
          - sshd_approved_macs=stig_almalinux9
      status: automated

    - id: ALMA-09-003650
      levels:
          - medium
      title: AlmaLinux OS 9 must force a frequent session key renegotiation for SSH connections to the server.
      rules:
          - sshd_rekey_limit
          - var_rekey_limit_size=1G
          - var_rekey_limit_time=1hour
      status: automated

    - id: ALMA-09-003870
      levels:
          - high
      title: AlmaLinux OS 9 IP tunnels must use FIPS 140-3 approved cryptographic algorithms.
      rules:
          - configure_libreswan_crypto_policy
      status: automated

    - id: ALMA-09-004310
      levels:
          - high
      title: AlmaLinux OS 9 must use the TuxCare ESU repository.
      notes: The remediation only enables an already configured tuxcare-esu repository. Installing tuxcare-release and registering the ESU license key must be done manually.
      rules:
          - ensure_tuxcare_esu_repo_enabled
      status: automated

    - id: ALMA-09-004320
      levels:
          - high
      title: AlmaLinux OS 9 must use the TuxCare FIPS packages and not the default encryption packages.
      notes: The remediation upgrades the packages from the configured repositories and only yields the TuxCare builds when the ESU repository is configured and licensed. Old default kernels must be removed manually after reboot.
      rules:
          - ensure_tuxcare_fips_packages_installed
      status: automated

    - id: ALMA-09-004420
      levels:
          - high
      title: AlmaLinux OS 9 must enable FIPS mode.
      notes: The STIG expects the FIPS-validated packages to come from the TuxCare ESU repository; the rules only verify and enable FIPS mode itself.
      rules:
          - enable_fips_mode
          - sysctl_crypto_fips_enabled
          - enable_dracut_fips_module
          - configure_crypto_policy
          - var_system_crypto_policy=fips
      status: automated

    - id: ALMA-09-004750
      levels:
          - medium
      title: AlmaLinux OS 9 must automatically expire temporary accounts within 72 hours.
      rules:
          - account_temp_expire_date
      status: manual

    - id: ALMA-09-004970
      levels:
          - medium
      title: AlmaLinux OS 9 must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/sudoers.
      rules:
          - audit_rules_sudoers
      status: automated

    - id: ALMA-09-005080
      levels:
          - medium
      title: AlmaLinux OS 9 must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/group.
      rules:
          - audit_rules_usergroup_modification_group
      status: automated

    - id: ALMA-09-005190
      levels:
          - medium
      title: AlmaLinux OS 9 must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/gshadow.
      rules:
          - audit_rules_usergroup_modification_gshadow
      status: automated

    - id: ALMA-09-005300
      levels:
          - medium
      title: AlmaLinux OS 9 must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/security/opasswd.
      rules:
          - audit_rules_usergroup_modification_opasswd
      status: automated

    - id: ALMA-09-005410
      levels:
          - medium
      title: AlmaLinux OS 9 must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/passwd.
      rules:
          - audit_rules_usergroup_modification_passwd
      status: automated

    - id: ALMA-09-005960
      levels:
          - medium
      title: AlmaLinux OS 9 must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/shadow.
      rules:
          - audit_rules_usergroup_modification_shadow
      status: automated

    - id: ALMA-09-006070
      levels:
          - medium
      title: AlmaLinux OS 9 must generate audit records for all account creations, modifications, disabling, and termination events that affect the files within /etc/sudoers.d/
      rules:
          - audit_rules_sudoers_d
      status: automated

    - id: ALMA-09-006180
      levels:
          - medium
      title: AlmaLinux OS 9 must require authentication to access emergency mode.
      rules:
          - require_emergency_target_auth
      status: automated

    - id: ALMA-09-006290
      levels:
          - medium
      title: ALMA 9 must require authentication upon booting into single-user and maintenance modes.
      rules:
          - grub2_password
      status: automated

    - id: ALMA-09-006400
      levels:
          - medium
      title: AlmaLinux OS 9 must require a unique superuser's name upon booting into single-user and maintenance modes.
      rules:
          - grub2_admin_username
      status: automated

    - id: ALMA-09-006510
      levels:
          - medium
      title: AlmaLinux OS 9 must require authentication to access single-user mode.
      rules:
          - require_singleuser_auth
      status: automated

    - id: ALMA-09-006620
      levels:
          - high
      title: The systemd Ctrl-Alt-Delete burst key sequence in AlmaLinux OS 9 must be disabled.
      rules:
          - disable_ctrlaltdel_burstaction
      status: automated

    - id: ALMA-09-006730
      levels:
          - high
      title: The Ctrl-Alt-Delete key sequence must be disabled on AlmaLinux OS 9.
      rules:
          - disable_ctrlaltdel_reboot
      status: automated

    - id: ALMA-09-006840
      levels:
          - medium
      title: AlmaLinux OS 9 must have the sudo package installed.
      rules:
          - package_sudo_installed
      status: automated

    - id: ALMA-09-006950
      levels:
          - medium
      title: The AlmaLinux OS 9 debug-shell systemd service must be disabled.
      rules:
          - service_debug-shell_disabled
      status: automated

    - id: ALMA-09-007060
      levels:
          - medium
      title: AlmaLinux OS 9 must enable kernel parameters to enforce discretionary access control on hardlinks.
      rules:
          - sysctl_fs_protected_hardlinks
      status: automated

    - id: ALMA-09-007170
      levels:
          - medium
      title: AlmaLinux OS 9 must enable kernel parameters to enforce discretionary access control (DAC) on symlinks.
      rules:
          - sysctl_fs_protected_symlinks
      status: automated

    - id: ALMA-09-007280
      levels:
          - medium
      title: AlmaLinux OS 9 must audit uses of the "execve" system call.
      rules:
          - audit_rules_suid_privilege_function
      status: automated

    - id: ALMA-09-007500
      levels:
          - medium
      title: AlmaLinux OS 9 must automatically lock an account when three unsuccessful logon attempts occur.
      rules:
          - accounts_passwords_pam_faillock_deny
          - var_accounts_passwords_pam_faillock_deny=3
      status: automated

    - id: ALMA-09-007610
      levels:
          - medium
      title: AlmaLinux OS 9 must automatically lock the root account until the root account is released by an administrator when three unsuccessful logon attempts occur during a 15-minute time period.
      rules:
          - accounts_passwords_pam_faillock_deny_root
      status: automated

    - id: ALMA-09-007720
      levels:
          - medium
      title: AlmaLinux OS 9 must automatically lock an account when three unsuccessful logon attempts occur during a 15-minute time period.
      rules:
          - accounts_passwords_pam_faillock_interval
          - var_accounts_passwords_pam_faillock_fail_interval=900
      status: automated

    - id: ALMA-09-007830
      levels:
          - medium
      title: AlmaLinux OS 9 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file.
      rules:
          - account_password_pam_faillock_system_auth
      status: automated

    - id: ALMA-09-007940
      levels:
          - medium
      title: AlmaLinux OS 9 must configure the use of the pam_faillock.so module in the /etc/pam.d/password-auth file.
      rules:
          - account_password_pam_faillock_password_auth
      status: automated

    - id: ALMA-09-008050
      levels:
          - medium
      title: AlmaLinux OS 9 must log username information when unsuccessful logon attempts occur.
      rules:
          - accounts_passwords_pam_faillock_audit
      status: automated

    - id: ALMA-09-008160
      levels:
          - medium
      title: AlmaLinux OS 9 must maintain an account lock until the locked account is manually released by an administrator; and not automatically after a set time.
      rules:
          - accounts_passwords_pam_faillock_unlock_time
          - var_accounts_passwords_pam_faillock_unlock_time=never
      status: automated

    - id: ALMA-09-008270
      levels:
          - medium
      title: AlmaLinux OS 9 must ensure account locks persist across reboots.
      rules:
          - accounts_passwords_pam_faillock_dir
      status: automated

    - id: ALMA-09-008380
      levels:
          - medium
      title: AlmaLinux OS 9 must configure the appropriate SELinux context on the nondefault faillock tally directory.
      rules:
          - account_password_selinux_faillock_dir
      status: automated

    - id: ALMA-09-008490
      levels:
          - medium
      title: AlmaLinux OS 9 must prevent users from disabling the Standard Mandatory DoW Notice and Consent Banner for graphical user interfaces.
      rules:
          - dconf_gnome_banner_enabled
      status: automated

    - id: ALMA-09-008600
      levels:
          - medium
      title: AlmaLinux OS 9 must display the Standard Mandatory DoW Notice and Consent Banner before granting local or remote access to the system via a graphical user logon.
      rules:
          - dconf_gnome_banner_enabled
          - dconf_gnome_login_banner_text
          - dconf_login_banner_text=dod_banners
          - dconf_login_banner_contents=dod_default
      status: automated

    - id: ALMA-09-008710
      levels:
          - medium
      title: AlmaLinux OS 9 must display the Standard Mandatory DoW Notice and Consent Banner before granting local or remote access to the system via a command line user logon.
      rules:
          - banner_etc_issue
          - login_banner_text=dod_banners
          - login_banner_contents=dod_default
      status: automated

    - id: ALMA-09-008820
      levels:
          - medium
      title: AlmaLinux OS 9 must display the Standard Mandatory DoW Notice and Consent Banner before granting local or remote access to the system via an SSH user logon.
      rules:
          - banner_etc_issue_net
          - sshd_enable_warning_banner_net
          - login_banner_text=dod_banners
          - login_banner_contents=dod_default
      status: automated

    - id: ALMA-09-009260
      levels:
          - medium
      title: AlmaLinux OS 9 must have the s-nail package installed.
      rules:
          - package_s-nail_installed
      status: automated

    - id: ALMA-09-009370
      levels:
          - medium
      title: AlmaLinux OS 9 SSH daemon must not allow Generic Security Service Application Program Interface (GSSAPI) authentication.
      rules:
          - sshd_disable_gssapi_auth
      status: automated

    - id: ALMA-09-009480
      levels:
          - medium
      title: AlmaLinux OS 9 SSH daemon must not allow Kerberos authentication.
      rules:
          - sshd_disable_kerb_auth
      status: automated

    - id: ALMA-09-009590
      levels:
          - high
      title: AlmaLinux OS 9 must check the GPG signature of software packages originating from external software repositories before installation.
      rules:
          - ensure_gpgcheck_globally_activated
      status: automated

    - id: ALMA-09-009700
      levels:
          - high
      title: AlmaLinux OS 9 must ensure cryptographic verification of vendor software packages.
      notes: Only the AlmaLinux OS 9 package-signing key is verified. The TuxCare package-signing key also required by the STIG is not checked by any rule yet.
      rules:
          - ensure_almalinux_gpgkey_installed
      status: automated

    - id: ALMA-09-009810
      levels:
          - high
      title: AlmaLinux OS 9 must check the GPG signature of locally installed software packages before installation.
      rules:
          - ensure_gpgcheck_local_packages
      status: automated

    - id: ALMA-09-009920
      levels:
          - high
      title: AlmaLinux OS 9 must check the GPG signature of repository metadata before package installation.
      rules:
          - ensure_gpgcheck_repo_metadata
      status: automated

    - id: ALMA-09-010030
      levels:
          - high
      title: AlmaLinux OS 9 must have GPG signature verification enabled for all software repositories.
      rules:
          - ensure_gpgcheck_never_disabled
      status: automated

    - id: ALMA-09-010140
      levels:
          - medium
      title: AlmaLinux OS 9 must prevent the loading of a new kernel for later execution.
      rules:
          - sysctl_kernel_kexec_load_disabled
      status: automated

    - id: ALMA-09-010250
      levels:
          - medium
      title: AlmaLinux OS 9 system commands must be group-owned by root or a system account.
      rules:
          - file_groupownership_system_commands_dirs
      status: automated

    - id: ALMA-09-010360
      levels:
          - medium
      title: AlmaLinux OS 9 system commands must be owned by root.
      rules:
          - file_ownership_binary_dirs
      status: automated

    - id: ALMA-09-010470
      levels:
          - medium
      title: AlmaLinux OS 9 system commands must have mode 755 or less permissive.
      rules:
          - file_permissions_binary_dirs
      status: automated

    - id: ALMA-09-010580
      levels:
          - medium
      title: AlmaLinux OS 9 library directories must be group-owned by root or a system account.
      rules:
          - dir_group_ownership_library_dirs
      status: automated

    - id: ALMA-09-010690
      levels:
          - medium
      title: AlmaLinux OS 9 library directories must be owned by root.
      rules:
          - dir_ownership_library_dirs
      status: automated

    - id: ALMA-09-010800
      levels:
          - medium
      title: AlmaLinux OS 9 library directories must have mode 755 or less permissive.
      rules:
          - dir_permissions_library_dirs
      status: automated

    - id: ALMA-09-010910
      levels:
          - medium
      title: AlmaLinux OS 9 library files must be group-owned by root or a system account.
      rules:
          - root_permissions_syslibrary_files
      status: automated

    - id: ALMA-09-011020
      levels:
          - medium
      title: AlmaLinux OS 9 library files must be owned by root.
      rules:
          - file_ownership_library_dirs
      status: automated

    - id: ALMA-09-011130
      levels:
          - medium
      title: AlmaLinux OS 9 library files must have mode 755 or less permissive.
      rules:
          - file_permissions_library_dirs
      status: automated

    - id: ALMA-09-011240
      levels:
          - medium
      title: AlmaLinux OS 9 must disable core dumps for all users.
      rules:
          - disable_users_coredumps
      status: automated

    - id: ALMA-09-011350
      levels:
          - medium
      title: AlmaLinux OS 9 must disable acquiring, saving, and processing core dumps.
      rules:
          - service_systemd-coredump_disabled
      status: automated

    - id: ALMA-09-011460
      levels:
          - medium
      title: AlmaLinux OS 9 must disable storing core dumps.
      rules:
          - coredump_disable_storage
      status: automated

    - id: ALMA-09-011570
      levels:
          - medium
      title: AlmaLinux OS 9 must disable core dump backtraces.
      rules:
          - coredump_disable_backtraces
      status: automated

    - id: ALMA-09-011680
      levels:
          - medium
      title: AlmaLinux OS 9 must disable the kernel.core_pattern.
      rules:
          - sysctl_kernel_core_pattern
      status: automated

    - id: ALMA-09-011790
      levels:
          - medium
      title: AlmaLinux OS 9 cron configuration files directory must be group-owned by root.
      rules:
          - file_groupowner_cron_d
          - file_groupowner_cron_daily
          - file_groupowner_cron_hourly
          - file_groupowner_cron_monthly
          - file_groupowner_cron_weekly
          - file_groupowner_crontab
          - file_groupowner_cron_deny
      status: automated

    - id: ALMA-09-011900
      levels:
          - medium
      title: AlmaLinux OS 9 cron configuration files directory must be owned by root.
      rules:
          - file_owner_cron_d
          - file_owner_cron_daily
          - file_owner_cron_hourly
          - file_owner_cron_monthly
          - file_owner_cron_weekly
          - file_owner_crontab
          - file_owner_cron_deny
      status: automated

    - id: ALMA-09-012010
      levels:
          - medium
      title: AlmaLinux OS 9 cron configuration directories must have a mode of 0700 or less permissive.
      rules:
          - file_permissions_cron_d
          - file_permissions_cron_daily
          - file_permissions_cron_hourly
          - file_permissions_cron_monthly
          - file_permissions_cron_weekly
      status: automated

    - id: ALMA-09-012120
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/crontab file must have mode 0600.
      rules:
          - file_permissions_crontab
      status: automated

    - id: ALMA-09-012230
      levels:
          - medium
      title: AlmaLinux OS 9 must disable the ability of a user to accidentally press Ctrl-Alt-Del and cause a system to shut down or reboot.
      rules:
          - dconf_gnome_disable_ctrlaltdel_reboot
      status: automated

    - id: ALMA-09-012340
      levels:
          - medium
      title: AlmaLinux OS 9 must prevent a user from overriding the Ctrl-Alt-Del sequence settings for the graphical user interface.
      rules:
          - dconf_gnome_disable_ctrlaltdel_reboot
      status: automated

    - id: ALMA-09-012450
      levels:
          - medium
      title: All AlmaLinux OS 9 local files and directories must have a valid group owner.
      rules:
          - file_permissions_ungroupowned
      status: automated

    - id: ALMA-09-012560
      levels:
          - medium
      title: All AlmaLinux OS 9 local files and directories must have a valid owner.
      rules:
          - no_files_unowned_by_user
      status: automated

    - id: ALMA-09-012670
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/group- file must be group owned by root.
      rules:
          - file_groupowner_backup_etc_group
      status: automated

    - id: ALMA-09-012780
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/group- file must be owned by root.
      rules:
          - file_owner_backup_etc_group
      status: automated

    - id: ALMA-09-012890
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/group- file must have mode 0644 or less permissive to prevent unauthorized access.
      rules:
          - file_permissions_backup_etc_group
      status: automated

    - id: ALMA-09-013000
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/group file must be group owned by root.
      rules:
          - file_groupowner_etc_group
      status: automated

    - id: ALMA-09-013110
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/group file must be owned by root.
      rules:
          - file_owner_etc_group
      status: automated

    - id: ALMA-09-013220
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/group file must have mode 0644 or less permissive to prevent unauthorized access.
      rules:
          - file_permissions_etc_group
      status: automated

    - id: ALMA-09-013330
      levels:
          - medium
      title: The /boot/grub2/grub.cfg file must be group-owned by root.
      rules:
          - file_groupowner_grub2_cfg
      status: automated

    - id: ALMA-09-013440
      levels:
          - medium
      title: The /boot/grub2/grub.cfg file must be owned by root.
      rules:
          - file_owner_grub2_cfg
      status: automated

    - id: ALMA-09-013550
      levels:
          - medium
      title: AlmaLinux OS 9 must disable the ability of systemd to spawn an interactive boot process.
      rules:
          - grub2_disable_interactive_boot
      status: automated

    - id: ALMA-09-013660
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/gshadow- file must be group-owned by root.
      rules:
          - file_groupowner_backup_etc_gshadow
      status: automated

    - id: ALMA-09-013770
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/gshadow- file must be owned by root.
      rules:
          - file_owner_backup_etc_gshadow
      status: automated

    - id: ALMA-09-013880
      levels:
          - medium
      title: AlmaLinux OS 9 /etc/gshadow- file must have mode 0000 or less permissive to prevent unauthorized access.
      rules:
