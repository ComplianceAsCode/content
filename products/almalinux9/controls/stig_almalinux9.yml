      rules:
          - file_group_ownership_var_log_audit_stig
      status: automated

    - id: ALMA-09-056010
      levels:
          - medium
      title: AlmaLinux OS 9 audit logs must be owned by root to prevent unauthorized read access.
      rules:
          - file_ownership_var_log_audit_stig
      status: automated

    - id: ALMA-09-056120
      levels:
          - medium
      title: AlmaLinux OS 9 audit logs must have 0600 permissions to prevent unauthorized read access.
      rules:
          - file_permissions_var_log_audit
      status: automated

    - id: ALMA-09-056230
      levels:
