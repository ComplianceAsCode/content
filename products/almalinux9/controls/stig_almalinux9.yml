      rules:
          - audit_rules_cron_execution
      status: automated

    - id: ALMA-09-039290
      levels:
          - high
      title: AlmaLinux 9 cryptographic policy must not be overridden.
      notes: This rule only contains SCE (Script Check Engine) content. The package openscap-engine-sce must be installed on the target system for the check to work.
      rules:
          - crypto_policy_not_overridden
      status: automated

    - id: ALMA-09-039840
      levels:
          - high
      title: AlmaLinux OS 9 must have the crypto-policies package installed.
      rules:
          - package_crypto-policies_installed
      status: automated

