    - id: ALMA-09-055240
      levels:
          - medium
      title: AlmaLinux OS 9 must have the chrony package installed.
      rules:
          - package_chrony_installed
      status: automated

    - id: ALMA-09-055350
      levels:
          - medium
      title: AlmaLinux OS 9 must securely compare internal information system clocks at least every 24 hours.
      rules:
          - chronyd_or_ntpd_set_maxpoll
          - chronyd_server_directive
          - chronyd_specify_remote_server
          - var_multiple_time_servers=stig
          - var_time_service_set_maxpoll=18_hours
      status: automated

    - id: ALMA-09-055680
      levels:
          - medium
