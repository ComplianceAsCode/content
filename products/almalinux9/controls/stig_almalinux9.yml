      title: AlmaLinux OS 9 must have mail aliases to notify the information system security officer (ISSO) and system administrator (SA) (at a minimum) in the event of an audit processing failure.
      rules:
          - postfix_client_configure_mail_alias
      status: automated

    - id: ALMA-09-054030
      levels:
          - medium
      title: AlmaLinux OS 9 audit system must take appropriate action when an error writing to the audit storage volume occurs.
      rules:
          - auditd_data_disk_error_action_stig
          - var_auditd_disk_error_action=halt
      status: automated

    - id: ALMA-09-054140
      levels:
          - medium
      title: AlmaLinux OS 9 audit system must take appropriate action when the audit storage volume is full.
      rules:
          - auditd_data_disk_full_action_stig
          - var_auditd_disk_full_action=halt
      status: automated

    - id: ALMA-09-054250
      levels:
          - medium
      title: AlmaLinux OS 9 must take appropriate action when a critical audit processing failure occurs.
      rules:
          - audit_rules_system_shutdown
      status: automated

    - id: ALMA-09-054360
      levels:
          - medium
      title: AlmaLinux OS 9 audit system must make full use of the audit storage space.
      rules:
          - auditd_data_retention_max_log_file
          - var_auditd_max_log_file=8
      status: automated

    - id: ALMA-09-054470
      levels:
          - medium
      title: AlmaLinux OS 9 audit system must take appropriate action when the audit files have reached maximum size.
      rules:
          - auditd_data_retention_max_log_file_action_stig
          - var_auditd_max_log_file_action=rotate
      status: automated

    - id: ALMA-09-054580
      levels:
          - medium
      title: AlmaLinux OS 9 audit system must retain an optimal number of audit records.
      rules:
          - auditd_data_retention_num_logs
          - var_auditd_num_logs=5
      status: automated

    - id: ALMA-09-054690
      levels:
          - medium
      title: AlmaLinux OS 9 must periodically flush audit records to disk to prevent the loss of audit records.
      rules:
          - auditd_freq
          - var_auditd_freq=100
      status: automated

    - id: ALMA-09-054910
      levels:
          - medium
      title: The auditd service must be enabled on AlmaLinux OS 9.
      rules:
          - service_auditd_enabled
      status: automated

    - id: ALMA-09-055130
      levels:
